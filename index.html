<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>卒業記念ARフォトフレーム</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100dvh;
      background: #000; overflow: hidden; font-family: sans-serif;
    }
    #app-container {
      position: relative; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
    }
    /* カメラ映像（端が切れないようにcontainに修正済み） */
    #camera-stream {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; z-index: 1;
    }
    /* フレーム画像（端が切れないようにcontainに修正済み） */
    #frame-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; z-index: 2; pointer-events: none;
    }
    /* ★新規：桜を降らせるキャンバス */
    #sakura-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3; pointer-events: none;
    }
    
    /* UI（ボタン）の設定 */
    .ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; pointer-events: none;
    }
    .btn {
      pointer-events: auto; background: rgba(255, 255, 255, 0.9);
      border: none; border-radius: 50%; width: 60px; height: 60px;
      font-size: 24px; cursor: pointer; display: flex;
      justify-content: center; align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: absolute;
    }
    .btn:active { background: rgba(200, 200, 200, 1); }
    
    #capture-btn { width: 80px; height: 80px; font-size: 32px; bottom: 20px; right: 20%; }
    #prev-btn { left: 20px; bottom: 30px; }
    #next-btn { right: 20px; bottom: 30px; }
    /* ★新規：桜のオンオフボタン */
    #sakura-btn { top: 20px; right: 20px; font-size: 28px; width: 50px; height: 50px; transition: 0.3s; }

    /* スタート画面 */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9); color: white; z-index: 2000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 20px; box-sizing: border-box;
    }
    #start-btn {
      background: #ff5a5f; color: white; border: none; border-radius: 30px;
      padding: 15px 40px; font-size: 22px; font-weight: bold; cursor: pointer;
      margin-top: 20px; box-shadow: 0 4px 10px rgba(255,90,95,0.5);
    }
    
    /* 縦画面時の警告 */
    #landscape-warning {
      position: absolute; top:0; left:0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); color: white; z-index: 1000;
      display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    @media screen and (orientation: portrait) {
      #landscape-warning { display: flex; }
    }
  </style>
</head>
<body>

  <!-- スタート画面 -->
  <div id="start-screen">
    <h2>卒業記念フォトフレーム</h2>
    <p>スマホを「横向き」にして撮影します</p>
    <button id="start-btn">カメラを起動する</button>
  </div>

  <div id="landscape-warning">
    <h2>スマホを横向きにしてください</h2>
    <p>iPhoneの場合、コントロールセンターから<br>「画面の向きのロック」をオフにしてください</p>
  </div>

  <div id="app-container">
    <video id="camera-stream" autoplay playsinline muted></video>
    <img id="frame-overlay" />
    <canvas id="sakura-canvas"></canvas> <!-- ★桜キャンバス -->
    <div class="ui-layer">
      <button class="btn" id="sakura-btn" title="桜エフェクト">🌸</button>
      <button class="btn" id="prev-btn" style="display:none;">◀</button> <!-- フレーム1枚なので非表示 -->
      <button class="btn" id="capture-btn">📸</button>
      <button class="btn" id="next-btn" style="display:none;">▶</button> <!-- フレーム1枚なので非表示 -->
    </div>
  </div>

  <script>
    const video = document.getElementById('camera-stream');
    const overlay = document.getElementById('frame-overlay');
    const captureBtn = document.getElementById('capture-btn');
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const sakuraBtn = document.getElementById('sakura-btn');
    const sakuraCanvas = document.getElementById('sakura-canvas');
    const sCtx = sakuraCanvas.getContext('2d');

    // ★ 本番のフレーム画像 ★
    let frames = ['syousyo.png'];
    let currentFrameIndex = 0;

    function updateFrame() {
      overlay.src = frames[currentFrameIndex];
    }
    updateFrame();

    // ===============
    // 🌸 桜エフェクトの処理 🌸
    // ===============
    let sakuraActive = false;
    let animationId;
    let petals = [];

    // キャンバスのサイズを画面に合わせる
    function resizeCanvas() {
      sakuraCanvas.width = window.innerWidth;
      sakuraCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 桜の花びらを作る設計図
    class Petal {
      constructor() { this.reset(); this.y = Math.random() * sakuraCanvas.height; }
      reset() {
        this.x = Math.random() * sakuraCanvas.width;
        this.y = -20; // 画面の上からスタート
        this.size = Math.random() * 12 + 8; // 花びらの大きさ
        this.speedY = Math.random() * 1.5 + 0.5; // 落ちるスピード
        this.speedX = Math.random() * 2 - 1; // 左右の揺れ
        this.angle = Math.random() * 360; // 回転角度
        this.spin = Math.random() * 2 - 1; // 回転スピード
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.angle += this.spin;
        // 画面の下に落ちたら上に戻す
        if (this.y > sakuraCanvas.height) this.reset();
      }
      draw() {
        sCtx.save();
        sCtx.translate(this.x, this.y);
        sCtx.rotate(this.angle * Math.PI / 180);
        sCtx.fillStyle = 'rgba(255, 183, 197, 0.85)'; // 桜色
        sCtx.beginPath();
        // 花びらの形を描く
        sCtx.moveTo(0, this.size / 2);
        sCtx.quadraticCurveTo(this.size, this.size / 2, this.size / 2, -this.size / 2);
        sCtx.quadraticCurveTo(0, -this.size, -this.size / 2, -this.size / 2);
        sCtx.quadraticCurveTo(-this.size, this.size / 2, 0, this.size / 2);
        sCtx.fill();
        sCtx.restore();
      }
    }

    // 花びらを30枚用意する
    for (let i = 0; i < 30; i++) petals.push(new Petal());

    // 桜を動かすループ
    function drawSakura() {
      sCtx.clearRect(0, 0, sakuraCanvas.width, sakuraCanvas.height);
      if (sakuraActive) {
        petals.forEach(p => { p.update(); p.draw(); });
        animationId = requestAnimationFrame(drawSakura);
      }
    }

    // 桜ボタンを押したときのオン・オフ切り替え
    sakuraBtn.onclick = () => {
      sakuraActive = !sakuraActive;
      if (sakuraActive) {
        sakuraBtn.style.background = '#ffb7c5'; // ボタンをピンクに
        drawSakura();
      } else {
        sakuraBtn.style.background = 'rgba(255, 255, 255, 0.9)'; // 元の色に
        cancelAnimationFrame(animationId);
        sCtx.clearRect(0, 0, sakuraCanvas.width, sakuraCanvas.height);
      }
    };


    // ===============
    // 📷 カメラと撮影の処理 📷
    // ===============
    startBtn.onclick = async () => {
      try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) {}
      try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) {}
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        startScreen.style.display = 'none';
      } catch (err) {
        alert('カメラの起動に失敗しました。\nエラー: ' + err.name);
      }
    };

    // シャッターボタン（合成と保存）
    captureBtn.onclick = () => {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      
      // 1. カメラ映像を描画
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 2. 卒業証書フレームを描画
      ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);
      
      // 3. もし桜がONなら、桜も写真に焼き付ける！
      if (sakuraActive) {
        ctx.drawImage(sakuraCanvas, 0, 0, canvas.width, canvas.height);
      }
      
      try {
        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = `sotugyo_photo_${Date.now()}.jpg`;
        link.click();
      } catch (e) {
        alert('画像の保存に失敗しました。');
      }
    };
  </script>
</body>
</html>
