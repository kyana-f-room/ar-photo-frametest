<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>卒業記念ARフォトフレーム</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100dvh;
      background: #000; overflow: hidden; font-family: sans-serif;
    }
    #app-container {
      position: relative; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
    }
    /* カメラ映像を全画面に */
    #camera-stream {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; z-index: 1;
    }
    /* フレーム画像を重ねる */
    #frame-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; z-index: 2; pointer-events: none;
    }
    
    /* UI（ボタン）の設定 */
    .ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; pointer-events: none;
    }
    .btn {
      pointer-events: auto; background: rgba(255, 255, 255, 0.9);
      border: none; border-radius: 50%; width: 60px; height: 60px;
      font-size: 24px; cursor: pointer; display: flex;
      justify-content: center; align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: absolute;
    }
    .btn:active { background: rgba(200, 200, 200, 1); }
    
    #capture-btn { width: 80px; height: 80px; font-size: 32px; bottom: 20px; right: 20%; }
    #prev-btn { left: 20px; bottom: 30px; }
    #next-btn { right: 20px; bottom: 30px; }

    /* スタート画面（カメラ許可をもらうため必須） */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9); color: white; z-index: 2000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 20px; box-sizing: border-box;
    }
    #start-btn {
      background: #ff5a5f; color: white; border: none; border-radius: 30px;
      padding: 15px 40px; font-size: 22px; font-weight: bold; cursor: pointer;
      margin-top: 20px; box-shadow: 0 4px 10px rgba(255,90,95,0.5);
    }
    
    /* 縦画面時の警告 */
    #landscape-warning {
      position: absolute; top:0; left:0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); color: white; z-index: 1000;
      display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    @media screen and (orientation: portrait) {
      #landscape-warning { display: flex; }
    }
  </style>
</head>
<body>

  <!-- スタート画面 -->
  <div id="start-screen">
    <h2>卒業記念フォトフレーム</h2>
    <p>スマホを「横向き」にして撮影します</p>
    <button id="start-btn">カメラを起動する</button>
  </div>

  <div id="landscape-warning">
    <h2>スマホを横向きにしてください</h2>
    <p>iPhoneの場合、コントロールセンターから<br>「画面の向きのロック」をオフにしてください</p>
  </div>

  <div id="app-container">
    <!-- playsinlineとautoplayはスマホブラウザで必須 -->
    <video id="camera-stream" autoplay playsinline muted></video>
    <img id="frame-overlay" crossorigin="anonymous" />
    <div class="ui-layer">
      <button class="btn" id="prev-btn">◀</button>
      <button class="btn" id="capture-btn">📸</button>
      <button class="btn" id="next-btn">▶</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('camera-stream');
    const overlay = document.getElementById('frame-overlay');
    const captureBtn = document.getElementById('capture-btn');
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    // ★フレーム画像の設定★
    let frames = [
      // ★後で本番用の「syousyo.png」を追加するときは、下の // を消して有効にします
     'syousyo.png'
    ];
    let currentFrameIndex = 0;

    function updateFrame() {
      overlay.src = frames[currentFrameIndex];
    }
    updateFrame();

    // 左右ボタンでのフレーム切り替え
    document.getElementById('prev-btn').onclick = () => {
      currentFrameIndex = (currentFrameIndex - 1 + frames.length) % frames.length;
      updateFrame();
    };
    document.getElementById('next-btn').onclick = () => {
      currentFrameIndex = (currentFrameIndex + 1) % frames.length;
      updateFrame();
    };

    // カメラ起動処理
    startBtn.onclick = async () => {
      try {
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {}
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (e) {}

      try {
        // 背面カメラを要求
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        startScreen.style.display = 'none';
      } catch (err) {
        alert('カメラの起動に失敗しました。\nブラウザのカメラ権限を「許可」してください。\nエラー: ' + err.name);
      }
    };

    // シャッターボタン（合成と保存）
    captureBtn.onclick = () => {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      
      // 映像とフレームを合成
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);
      
      try {
        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = `sotugyo_photo_${Date.now()}.jpg`;
        link.click();
      } catch (e) {
        alert('画像の保存に失敗しました。');
      }
    };
  </script>
</body>
</html>
